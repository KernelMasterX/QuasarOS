name: Build QuasarOS GSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          build-mount-path: ${{ github.workspace }}
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deps & Repo & Auth
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 openjdk-11-jdk

          git config --global user.name "KernelMasterX"
          git config --global user.email "KernelMasterX@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Clone Treble Build Only
        run: |
          mkdir workspace && cd workspace
          git clone https://github.com/ponces/treble_aosp -b android-13.0 treble_build_aosp --depth=1
          ln -s treble_build_aosp treble_aosp

      # Sadece teşhis - henüz sync/build yapmıyoruz, önce script'in tam içeriğini görelim
      - name: Dump full build.sh content
        run: |
          echo "===== FULL build.sh ====="
          cat -A workspace/treble_build_aosp/build.sh | cat -n
          echo "===== END build.sh ====="