name: QuasarOS-Build-Release
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [arm64_bvN]
    name: Build ${{ matrix.variant }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space - CRITICAL
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 20480
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Setup
        run: |
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          sudo apt-get clean
          # apt update YOK - disk dolduruyor, zaten hepsi yüklü
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > /tmp/repo
          sudo install /tmp/repo /usr/local/bin/repo
          git config --global user.name "QuasarOS"
          git config --global user.email "quasar@lightthegalaxy.com"
          df -h
          free -h
          java -version

      - name: Sync Ponces Source
        run: |
          mkdir workspace && cd workspace
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r83 --depth=1
          git clone https://github.com/ponces/treble_aosp -b android-13.0 treble_aosp
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
          bash treble_aosp/build.sh
