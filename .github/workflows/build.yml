name: Build QuasarOS GSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Clone Ponces Treble AOSP (Android 13)
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig xz-utils

          git config --global user.name "KernelMasterX"
          git config --global user.email "KernelMasterX@users.noreply.github.com"

          mkdir -p workspace
          cd workspace
          git clone --depth 1 --branch android-13.0 https://github.com/ponces/treble_aosp.git .

      - name: Apply QuasarOS Branding & Inject Bootanimation
        run: |
          cd workspace
          
          # common.mk dosyasını kaynak ağacında dinamik olarak bulup güncelliyoruz
          COMMON_MK=$(find . -name "common.mk" | head -n 1)
          if [ -n "$COMMON_MK" ]; then
            echo "Found common.mk at: $COMMON_MK"
            sed -i 's/PRODUCT_MODEL := .*/PRODUCT_MODEL := QuasarOS - Light The Galaxy/' "$COMMON_MK" 2>/dev/null || true
            echo 'PRODUCT_PROPERTY_OVERRIDES += ro.quasar.display.version=Light The Galaxy' >> "$COMMON_MK"
            echo 'PRODUCT_PROPERTY_OVERRIDES += ro.product.maintainer=KernelMasterX' >> "$COMMON_MK"
          else
            echo "Warning: common.mk not found, skipping branding injection."
          fi

          # Inject bootanimation.zip if present in repository root
          if [ -f "$GITHUB_WORKSPACE/bootanimation.zip" ]; then
            MEDIA_DIR=$(dirname "$(find . -name "common.mk" | head -n 1)")/media
            mkdir -p "$MEDIA_DIR"
            cp "$GITHUB_WORKSPACE/bootanimation.zip" "$MEDIA_DIR/bootanimation.zip"
            COMMON_MK=$(find . -name "common.mk" | head -n 1)
            echo 'PRODUCT_COPY_FILES += $(call find-copy-subdir-files,*,$(LOCAL_PATH)/media,system/product/media)' >> "$COMMON_MK"
            echo "Bootanimation successfully injected!"
          else
            echo "Notice: bootanimation.zip not found in repository root, skipping."
          fi

      - name: Build arm64_bvN GSI (Standard VNDK)
        run: |
          cd workspace
          bash build.sh arm64_bvN

      - name: Compress system image
        run: |
          cd workspace
          IMG_FILE=$(find out/target/product -name "system-*.img" | head -n 1)
          if [ -n "$IMG_FILE" ]; then
            xz -9 -v -T0 "$IMG_FILE"
            XZ_PATH=$(find out/target/product -name "system-*.img.xz" | head -n 1)
            echo "RELEASE_FILE=$GITHUB_WORKSPACE/workspace/$XZ_PATH" >> $GITHUB_ENV
          else
            echo "Build failed: system image not found."
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: QuasarOS-v1.0
          name: QuasarOS v1.0 - Light The Galaxy (KernelMasterX)
          body: |
            QuasarOS v1.0 (Light The Galaxy)
            * **Source:** ponces/treble_aosp (Android 13)
            * **Variant:** arm64_bvN (Standard VNDK, Vanilla)
            * **Maintainer:** KernelMasterX
          files: "${{ env.RELEASE_FILE }}"
          
