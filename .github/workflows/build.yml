name: Build QuasarOS GSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize Disk to 75GB
        run: |
          echo "Before:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get clean
          echo "After:"
          df -h

      - name: Install Deps & Repo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 openjdk-8-jdk
          git config --global user.name "KernelMasterX"
          git config --global user.email "KernelMasterX@users.noreply.github.com"
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Repo Init & Sync
        run: |
          mkdir workspace && cd workspace
          repo init -u https://github.com/ponces/treble_manifest -b 13.0 --depth=1 --groups=all,-notdefault,-device,-mips,-darwin,-x86
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all)
          git clone https://github.com/ponces/treble_aosp -b android-13.0 treble_aosp --depth=1

      - name: Apply QuasarOS Branding
        run: |
          cd workspace/treble_aosp
          echo '' >> phh/treble/base.mk
          echo 'PRODUCT_MODEL := QuasarOS - Light The Galaxy' >> phh/treble/base.mk
          echo 'PRODUCT_BRAND := QuasarOS' >> phh/treble/base.mk
          echo 'PRODUCT_PROPERTY_OVERRIDES += ro.quasar.display.version=Light\ The\ Galaxy' >> phh/treble/base.mk
          echo 'PRODUCT_PROPERTY_OVERRIDES += ro.product.maintainer=KernelMasterX' >> phh/treble/base.mk

      - name: Inject Bootanimation
        run: |
          if [ -f "bootanimation.zip" ]; then
            mkdir -p workspace/treble_aosp/phh/treble/media
            cp bootanimation.zip workspace/treble_aosp/phh/treble/media/bootanimation.zip
            echo 'PRODUCT_COPY_FILES += phh/treble/media/bootanimation.zip:$(TARGET_COPY_OUT_PRODUCT)/media/bootanimation.zip' >> workspace/treble_aosp/phh/treble/base.mk
          fi

      - name: Build arm64_bvN
        run: |
          cd workspace
          # Repo bitti, 15-20GB .repo klasörünü derlemeden hemen önce siliyoruz
          rm -rf .repo
          echo "Disk after removing .repo:"
          df -h
          bash treble_aosp/build.sh arm64_bvN

      - name: Compress & Release
        run: |
          cd workspace
          IMG=$(find out -name "system-*.img" | head -n 1)
          echo "Found $IMG"
          [ -z "$IMG" ] && exit 1
          # out içindeki gereksiz ara dosyaları temizle
          find out -type f ! -name "*.img" -delete
          xz -9 -T0 "$IMG"
          mv out/target/product/*.img.xz ../QuasarOS-arm64_bvN.img.xz
          df -h

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: QuasarOS-v1.0-${{ github.run_number }}
          name: QuasarOS v1.0 - Light The Galaxy
          files: QuasarOS-arm64_bvN.img.xz
          
