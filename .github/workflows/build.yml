name: Build QuasarOS GSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Download Sources Safely
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig xz-utils

          mkdir -p workspace
          cd workspace
          
          # Git clone yok, şifre sorma yok! Direkt resmi kaynak arşivini indiriyoruz.
          curl -L https://github.com/phhusson/treble_aosp/archive/refs/heads/android-13.0.zip -o source.zip || curl -L https://github.com/TrebleDroid/treble_aosp/archive/refs/heads/android-13.0.zip -o source.zip
          unzip -q source.zip
          cp -r treble_aosp-android-13.0/* .
          rm -rf source.zip treble_aosp-android-13.0

      - name: Apply QuasarOS branding
        run: |
          cd workspace
          
          sed -i 's/PRODUCT_MODEL := .*/PRODUCT_MODEL := QuasarOS - Light The Galaxy/' device/phh/treble/common.mk 2>/dev/null || true
          echo 'PRODUCT_PROPERTY_OVERRIDES += ro.quasar.display.version=Light The Galaxy' >> device/phh/treble/common.mk
          echo 'PRODUCT_PROPERTY_OVERRIDES += ro.product.maintainer=KernelMasterX' >> device/phh/treble/common.mk

      - name: Build arm64_bvN GSI (Standard VNDK)
        run: |
          cd workspace
          bash build.sh arm64_bvN

      - name: Compress system image
        run: |
          cd workspace
          IMG_FILE=$(find out/target/product -name "system-*.img" | head -n 1)
          if [ -n "$IMG_FILE" ]; then
            xz -9 -v -T0 "$IMG_FILE"
            XZ_PATH=$(find out/target/product -name "system-*.img.xz" | head -n 1)
            echo "RELEASE_FILE=$GITHUB_WORKSPACE/workspace/$XZ_PATH" >> $GITHUB_ENV
          else
            echo "Build failed: system image not found."
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: QuasarOS-v1.0
          name: QuasarOS v1.0 - Light The Galaxy (KernelMasterX)
          body: |
            QuasarOS v1.0 (Light The Galaxy)
            * **Branch:** Android 13
            * **Variant:** arm64_bvN (Standard VNDK, Vanilla)
            * **Maintainer:** KernelMasterX
          files: "${{ env.RELEASE_FILE }}"
          
