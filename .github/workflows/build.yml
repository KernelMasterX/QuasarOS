name: Build QuasarOS GSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # 1. Önce diski büyütüp workspace'i /mnt alanına v10 sürümüyle bağlıyoruz
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 2048
          build-mount-path: ${{ github.workspace }}
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 2. Büyütülen diskin üzerine repoyu ve bootanimation.zip'i çekiyoruz
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deps & Repo & Auth
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 openjdk-11-jdk
          
          git config --global user.name "KernelMasterX"
          git config --global user.email "KernelMasterX@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Repo Init & Sync
        run: |
          mkdir workspace && cd workspace
          repo init -u https://github.com/TrebleDroid/treble_manifest -b android-13.0 -m manifest.xml
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all) --force-sync
          git clone https://github.com/ponces/treble_aosp -b android-13.0 treble_build_aosp --depth=1
          ln -s treble_build_aosp treble_aosp
          echo "Disk after sync:"
          df -h
          ls -la

      - name: Apply QuasarOS Branding
        run: |
          BASE=$(find workspace -name "base.mk" | grep "phh/treble" | head -n 1)
          echo "Found base.mk at: $BASE"
          [ -z "$BASE" ] && exit 1
          echo '' >> "$BASE"
          echo 'PRODUCT_MODEL := QuasarOS - Light The Galaxy' >> "$BASE"
          echo 'PRODUCT_BRAND := QuasarOS' >> "$BASE"
          echo 'PRODUCT_PROPERTY_OVERRIDES += ro.quasar.display.version=Light\ The\ Galaxy' >> "$BASE"
          echo 'PRODUCT_PROPERTY_OVERRIDES += ro.product.maintainer=KernelMasterX' >> "$BASE"
          cat "$BASE" | tail -10

      - name: Inject Bootanimation
        run: |
          BASE=$(find workspace -name "base.mk" | grep "phh/treble" | head -n 1)
          if [ -n "$BASE" ] && [ -f "bootanimation.zip" ]; then
            BASE_DIR=$(dirname "$BASE")
            mkdir -p "$BASE_DIR/media"
            cp bootanimation.zip "$BASE_DIR/media/bootanimation.zip"
            echo 'PRODUCT_COPY_FILES += device/phh/treble/media/bootanimation.zip:$(TARGET_COPY_OUT_PRODUCT)/media/bootanimation.zip' >> "$BASE"
            echo "Bootanimation injected successfully!"
          else
            echo "bootanimation.zip not found or base.mk missing, skipping injection."
          fi

      - name: Build arm64_bvN
        run: |
          cd workspace
          rm -rf .repo
          echo "Disk after removing .repo:"
          df -h
          export WITHOUT_CHECK_API=true
          export CCACHE_DISABLE=1
          bash treble_build_aosp/build.sh arm64_bvN

      - name: Compress & Release
        run: |
          cd workspace
          IMG=$(find out -name "system-*.img" | head -n 1)
          echo "Found $IMG"
          [ -z "$IMG" ] && exit 1
          find out -type f ! -name "*.img" -delete
          xz -9 -T0 "$IMG"
          mv out/target/product/*.img.xz ../QuasarOS-arm64_bvN.img.xz
          df -h

      - name: Create Public Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: QuasarOS-v1.0-${{ github.run_number }}
          name: QuasarOS v1.0 - Light The Galaxy
          body: |
            QuasarOS v1.0 - Light The Galaxy
            * **Maintainer:** KernelMasterX
            * **Base:** Android 13.0 (TrebleDroid)
            * **Variant:** arm64_bvN (Standard VNDK, Vanilla)
          files: QuasarOS-arm64_bvN.img.xz
          
