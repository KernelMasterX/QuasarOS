name: Build QuasarOS GSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # 1. Root'ta hâlâ bol yer varken paketleri kur
      - name: Install Deps & Repo & Auth
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 openjdk-11-jdk jq

          git config --global user.name "KernelMasterX"
          git config --global user.email "KernelMasterX@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      # 2. Şimdi diski büyütüp workspace'i buna mount ediyoruz
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          build-mount-path: ${{ github.workspace }}
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Treble Build
        run: |
          mkdir workspace && cd workspace
          git clone https://github.com/ponces/treble_aosp -b android-13.0 treble_build_aosp --depth=1
          ln -s treble_build_aosp treble_aosp

      - name: Repo Init & Sync
        run: |
          cd workspace
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r82 --depth=1
          mkdir -p .repo/local_manifests
          cp treble_build_aosp/manifest.xml .repo/local_manifests/aosp.xml
          repo sync -c --force-sync --no-clone-bundle --no-tags --depth=1 -j$(nproc --all)
          echo "Disk after sync:"
          df -h

      - name: Prepare Branding Hook
        working-directory: workspace
        run: |
          cat > branding_hook.sh << 'HOOK'
          echo "--> Applying QuasarOS branding (post-patch hook)"
          BASE=$(find . -name "base.mk" | grep "phh/treble" | head -n 1)
          echo "Found base.mk at: $BASE"
          if [ -n "$BASE" ]; then
              echo '' >> "$BASE"
              echo 'PRODUCT_MODEL := QuasarOS - Light The Galaxy' >> "$BASE"
              echo 'PRODUCT_BRAND := QuasarOS' >> "$BASE"
              echo 'PRODUCT_PROPERTY_OVERRIDES += ro.quasar.display.version=Light\ The\ Galaxy' >> "$BASE"
              echo 'PRODUCT_PROPERTY_OVERRIDES += ro.product.maintainer=KernelMasterX' >> "$BASE"

              if [ -f "../bootanimation.zip" ]; then
                  BASE_DIR=$(dirname "$BASE")
                  mkdir -p "$BASE_DIR/media"
                  cp ../bootanimation.zip "$BASE_DIR/media/bootanimation.zip"
                  echo 'PRODUCT_COPY_FILES += device/phh/treble/media/bootanimation.zip:$(TARGET_COPY_OUT_PRODUCT)/media/bootanimation.zip' >> "$BASE"
                  echo "Bootanimation injected successfully!"
              else
                  echo "bootanimation.zip not found, skipping injection."
              fi
          else
              echo "base.mk not found, branding skipped!"
          fi
          echo
          HOOK
          echo "Hook file ready:"
          cat branding_hook.sh

      - name: Patch build.sh
        working-directory: workspace
        run: |
          sed -i \
            -e '/^buildGappsVariant$/d' \
            -e '/system-treble_arm64_bgN\.img -T0/d' \
            -e '/^applyPatches$/r branding_hook.sh' \
            treble_build_aosp/build.sh
          echo "===== Patched sequence (end of file) ====="
          tail -30 treble_build_aosp/build.sh

      - name: Build (vanilla only)
        working-directory: workspace
        run: |
          mkdir -p tmp_build
          export TMPDIR="$(pwd)/tmp_build"
          echo "Disk before build:"
          df -h
          export WITHOUT_CHECK_API=true
          export CCACHE_DISABLE=1
          bash treble_build_aosp/build.sh

      - name: Locate & Release
        run: |
          IMG=$(find "$HOME/builds" -name "aosp-arm64-ab-vanilla-13.0-*.img.xz" | head -n 1)
          echo "Found $IMG"
          [ -z "$IMG" ] && exit 1
          cp "$IMG" QuasarOS-arm64_bvN.img.xz
          df -h

      - name: Create Public Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: QuasarOS-v1.0-${{ github.run_number }}
          name: QuasarOS v1.0 - Light The Galaxy
          body: |
            QuasarOS v1.0 - Light The Galaxy
            * **Maintainer:** KernelMasterX
            * **Base:** Android 13.0 (TrebleDroid)
            * **Variant:** arm64_bvN (Standard VNDK, Vanilla)
          files: QuasarOS-arm64_bvN.img.xz