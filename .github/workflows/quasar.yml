name: QuasarOS A13 Light The Galaxy
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Araçlar Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs unzip python3-pip
          pip3 install requests

      - name: Ponces A13 Vanilla İndir
        run: |
          wget https://github.com/ponces/treble_aosp/releases/download/v2023.09.19/aosp-arm64-ab-vanilla-13.0-20230919.img.xz
          xz -d *.xz
          mv *.img base.img
          cp base.img raw.img
          ls -lh raw.img

      - name: BitGApps Mediafire'dan İndir
        run: |
          python3 - << 'PY'
          import requests, re
          url = "https://www.mediafire.com/file/jrh0rbj8tcd7jda/BiTGApps-arm64-13.0.0-20260822-112657-CORE.zip/file?dkey=akpvn8fyvmc&r=1155"
          headers = {"User-Agent": "Mozilla/5.0"}
          print(f"Sayfa: {url}")
          r = requests.get(url, headers=headers)
          m = re.search(r'href="(https://download\d+\.mediafire\.com[^"]+)"', r.text)
          if not m:
              m = re.search(r'href="(https://download[^"]+mediafire[^"]+)"', r.text)
          if not m:
              print(r.text[:3000])
              raise SystemExit("Direct link bulunamadı")
          dl = m.group(1).replace("&amp;", "&")
          print(f"Direct: {dl}")
          with requests.get(dl, stream=True, headers=headers) as d:
              d.raise_for_status()
              with open("bit.zip", "wb") as f:
                  for chunk in d.iter_content(1024*1024):
                      if chunk: f.write(chunk)
          print("bit.zip indirildi")
          PY
          unzip bit.zip -d bit
          ls -R bit | head -n 100

      - name: Quasar Modla - Light The Galaxy
        run: |
          mkdir mnt
          sudo mount -o loop raw.img mnt

          echo "BitGApps gömülüyor..."
          sudo cp -r bit/*/system/* mnt/system/ 2>/dev/null || true
          sudo cp -a bit/BiTGApps/* mnt/ 2>/dev/null || true

          echo "Bootanimation kontrol..."
          ls -lh bootanimation.zip || echo "bootanimation.zip yok"
          if [ -f bootanimation.zip ]; then
            sudo mkdir -p mnt/system/media
            sudo cp bootanimation.zip mnt/system/media/bootanimation.zip
            sudo chmod 644 mnt/system/media/bootanimation.zip
            echo "Bootanimation gömüldü"
          fi

          echo "build.prop düzenleniyor..."
          echo "" | sudo tee -a mnt/system/build.prop
          echo "# QuasarOS - Light the Galaxy" | sudo tee -a mnt/system/build.prop
          echo "ro.quasar.version=1.0" | sudo tee -a mnt/system/build.prop
          echo "ro.quasar.slogan=Light the Galaxy" | sudo tee -a mnt/system/build.prop
          echo "ro.quasar.base=Ponces A13 Vanilla" | sudo tee -a mnt/system/build.prop
          echo "ro.quasar.gapps=BiTGApps-Core-20260822" | sudo tee -a mnt/system/build.prop

          sudo umount mnt
          mv raw.img QuasarOS-A13-LightTheGalaxy.img
          xz -9 -T0 QuasarOS-A13-LightTheGalaxy.img
          ls -lh

      - name: Yükle
        uses: actions/upload-artifact@v4
        with:
          name: QuasarOS-A13-LightTheGalaxy
          path: QuasarOS-A13-LightTheGalaxy.img.xz
