name: QuasarOS-Build-Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    strategy:
      fail-fast: false
      matrix:
        variant: [arm64_bvN, arm64_bgN, arm64_bvN-core]
    
    name: Build ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          # GITHUB ACTIONS'I FAKİRLİKTEN KURTAR
          echo "Temizlik öncesi:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt clean
          echo "Temizlik sonrası:"
          df -h

          sudo apt update && sudo apt install -y git repo python3 xz-utils -q
          git config --global user.name "QuasarOS"
          git config --global user.email "quasar@lightthegalaxy.com"
          sudo fallocate -l 32G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: Sync
        run: |
          mkdir workspace && cd workspace
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r83 --depth=1
          git clone https://github.com/ponces/treble_aosp -b android-13.0 treble_aosp
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags
          bash treble_aosp/build.sh --no-build

      - name: Build
        run: |
          cd workspace
          . build/envsetup.sh
          if [[ "${{ matrix.variant }}" == *"-core"* ]]; then
            lunch treble_arm64_bgN-userdebug
            echo "GAPPS_VARIANT := core" >> device/phh/treble/treble.mk
          else
            lunch treble_${{ matrix.variant }}-userdebug
          fi
          make systemimage -j$(nproc)
          # xz sıkıştır ve ismini variant yap
          IMG_PATH=$(find out/target/product -name "system.img" | head -n 1)
          echo "IMG_PATH=$IMG_PATH" >> $GITHUB_ENV
          xz -9 -T0 -c $IMG_PATH > ${{ matrix.variant }}.img.xz
          ls -lh *.img.xz

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ matrix.variant }}-${{ github.run_number }}
          name: QuasarOS v1.0 - ${{ matrix.variant }} | Light the Galaxy
          body: |
            🌌 **QuasarOS - Light the Galaxy**
            Variant: `${{ matrix.variant }}`
            Base: Android 13.0.0_r83
            Build: ${{ github.run_number }}
            
            Flash: fastboot flash system system.img
          files: workspace/${{ matrix.variant }}.img.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
